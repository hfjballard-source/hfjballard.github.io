<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   IMAGE POPUP
===================================================== */

function openImage(image, title, description) {

    const modal =
        document.getElementById("imageModal");

    const modalImage =
        document.getElementById("modalImage");

    const modalTitle =
        document.getElementById("modalTitle");

    const modalDescription =
        document.getElementById("modalDescription");


    modalImage.src = image;

    modalImage.alt = title;

    modalTitle.textContent = title;

    modalDescription.textContent = description;


    modal.classList.add("active");

    document.body.style.overflow = "hidden";

}



function closeImage() {

    document
        .getElementById("imageModal")
        .classList.remove("active");

    document.body.style.overflow = "";

}


/* =====================================================
   CLOSE POPUP BY CLICKING OUTSIDE
===================================================== */

document
    .getElementById("imageModal")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeImage();

            }

        }
    );


/* =====================================================
   ESCAPE KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeImage();

        }

    }
);


/* =====================================================
   CHARACTER SCROLL ANIMATION
=====================================================

   The characters don't simply slide in.

   Their movement is calculated from the scroll
   position, allowing them to:

       1. Start outside the scene.
       2. Lean inward.
       3. Reach their maximum lean.
       4. Lean back outward.
       5. Leave the scene.

   The transform-origin is set in CSS to the
   bottom center of each character.
===================================================== */

const characterStage =
    document.querySelector(".character-stage");

const leftCharacter =
    document.querySelector(".character-left");

const rightCharacter =
    document.querySelector(".character-right");


function clamp(value, min, max) {

    return Math.min(
        Math.max(value, min),
        max
    );

}


function smoothStep(value) {

    return value * value * (3 - 2 * value);

}


function updateCharacters() {

    if (!characterStage) {
        return;
    }


    const rect =
        characterStage.getBoundingClientRect();

    const viewportHeight =
        window.innerHeight;


    /*
     * Progress through the character section.
     *
     * 0 = entering
     * 0.5 = middle
     * 1 = leaving
     */

    let progress =
        (viewportHeight - rect.top)
        /
        (viewportHeight + rect.height);


    progress =
        clamp(progress, 0, 1);


    /*
     * Convert the progress into a
     * gentle "lean in, lean out" curve.
     *
     * sin() gives us:
     *
     * 0 → 1 → 0
     */

    const lean =
        Math.sin(progress * Math.PI);


    /*
     * Small amount of horizontal movement.
     *
     * The rotation is intentionally much
     * more noticeable than the translation.
     */

    const slide =
        35 * (1 - lean);


    /*
     * Maximum rotation.
     *
     * Keeping this relatively small makes
     * the effect feel like a character
     * peeking into the page rather than
     * spinning around.
     */

    const rotation =
        10 * lean;


    /*
     * LEFT CHARACTER
     */

    leftCharacter.style.transform =
        `
        translateX(${-slide}px)
        rotate(${-rotation}deg)
        `;


    /*
     * RIGHT CHARACTER
     */

    rightCharacter.style.transform =
        `
        translateX(${slide}px)
        rotate(${rotation}deg)
        `;

}


/*
 * Update continuously while scrolling.
 */

let animationFrame = null;


function requestCharacterUpdate() {

    if (!animationFrame) {

        animationFrame =
            requestAnimationFrame(
                function() {

                    updateCharacters();

                    animationFrame = null;

                }
            );

    }

}


window.addEventListener(
    "scroll",
    requestCharacterUpdate,
    { passive: true }
);


window.addEventListener(
    "resize",
    requestCharacterUpdate
);


updateCharacters();


</script>
